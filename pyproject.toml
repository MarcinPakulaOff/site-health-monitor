[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-health-monitor"
version = "0.1.0"
description = "Small uptime, SSL-expiry and sitemap watchdog that alerts on change, not on every run."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marcin Pakuła" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
site-monitor = "site_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
